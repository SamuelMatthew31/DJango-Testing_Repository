{% extends 'base.html' %}

{% block title %}Todo List{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Todo List</h1>

<!-- Form tambah todo: hx-post ke view 'todos' yang sama, target-nya cuma tabel di bawah -->
<form hx-post="{% url 'todos' %}" hx-target="#todo-table" hx-swap="outerHTML" class="flex gap-2 mb-6">
    {% csrf_token %}
    <input
        type="text"
        name="title"
        placeholder="Tambah todo baru..."
        required
        class="flex-1 border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500"
    >
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors">
        Tambah
    </button>
</form>

{% include 'partials/_todo_table.html' %}
{% endblock %}
