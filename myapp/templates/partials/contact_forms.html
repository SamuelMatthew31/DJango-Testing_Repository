<!-- myapp/templates/partials/contact_form.html -->
<form hx-post="{% url 'contact' %}" hx-target="#form-wrapper" hx-swap="outerHTML"
      @htmx:before-request="loading = true" @htmx:after-request="loading = false"
      class="space-y-5" id="form-wrapper">
    {% csrf_token %}

    <div>
        <label for="{{ form.name.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        {{ form.name }}
        {% if form.name.errors %}
            <p class="text-sm text-red-600 mt-1">{{ form.name.errors.0 }}</p>
        {% endif %}
    </div>

    <div>
        <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        {{ form.email }}
        {% if form.email.errors %}
            <p class="text-sm text-red-600 mt-1">{{ form.email.errors.0 }}</p>
        {% endif %}
    </div>

    <div>
        <label for="{{ form.message.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
        {{ form.message }}
        {% if form.message.errors %}
            <p class="text-sm text-red-600 mt-1">{{ form.message.errors.0 }}</p>
        {% endif %}
    </div>

    <button type="submit" :disabled="loading"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-medium py-2.5 rounded-md transition">
        <span x-show="!loading">Submit</span>
        <span x-show="loading">Sending...</span>
    </button>
</form>
