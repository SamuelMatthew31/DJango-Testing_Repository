<table id="todo-table" class="w-full text-left border-collapse">
    <thead>
        <tr class="border-b">
            <th class="py-2 px-3">Judul</th>
            <th class="py-2 px-3">Status</th>
            <th class="py-2 px-3">Aksi</th>
        </tr>
    </thead>
    <tbody>
        {% for todo in todos %}
        <tr class="border-b hover:bg-gray-50">
            <td class="py-2 px-3 {% if todo.completed %}line-through text-gray-400{% endif %}">
                {{ todo.title }}
            </td>
            <td class="py-2 px-3">
                {% if todo.completed %}
                    <span class="text-green-600 font-medium">Completed</span>
                {% else %}
                    <span class="text-yellow-600 font-medium">Not Completed</span>
                {% endif %}
            </td>
            <td class="py-2 px-3">
                <!-- hx-post ke endpoint toggle baru, target & swap tabel yang sama -->
                <button
                    hx-post="{% url 'todo_toggle' todo.pk %}"
                    hx-target="#todo-table"
                    hx-swap="outerHTML"
                    class="text-sm text-blue-600 hover:underline"
                >
                    Toggle
                </button>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="py-4 px-3 text-center text-gray-400">Belum ada todo.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
